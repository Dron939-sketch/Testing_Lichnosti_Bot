services:
  - type: web
    name: variatica-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: YOOKASSA_SHOP_ID
        value: 1262862
      - key: YOOKASSA_SECRET_KEY
        sync: false
