services:
  - type: web
    name: variatica-bot
    env: python
    region: frankfurt
    buildCommand: |
      pip install -r requirements.txt
      # Создаем симлинк для обратной совместимости
      ln -sf app.py simple_server.py
      echo "✅ Создан симлинк: app.py → simple_server.py"
    startCommand: python app.py  # или gunicorn app:app
    envVars:
      - key: PORT
        value: "10000"
      # ... остальные переменные
