services:
  - type: web
    name: variatica-bot
    env: python
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python run_bot.py  # Используем отдельный скрипт для бота
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: PORT
        value: "5000"
    autoDeploy: true
