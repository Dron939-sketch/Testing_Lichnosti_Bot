services:
  # Telegram Bot Service
  - type: web
    name: variatica-telegram-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot_adaptive.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WEBHOOK_URL
        value: https://variatica-webhook-server.onrender.com
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false

  # Flask Webhook Server
  - type: web
    name: variatica-webhook-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: WEBHOOK_URL
        value: https://variatica-webhook-server.onrender.com
