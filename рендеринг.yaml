services:
  - type: web
    name: variatica-bot
    env: python
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip setuptools wheel
      pip install python-telegram-bot==20.7 --no-cache-dir
      pip install -r requirements.txt --no-cache-dir
      echo "=== УСТАНОВЛЕННЫЕ ВЕРСИИ ==="
      pip show python-telegram-bot
    startCommand: python app.py
    envVars:
      - key: PORT
        value: "10000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: BOT_LINK
        sync: false
      - key: GIFT_PDF_LINK
        sync: false
      - key: AUTHOR_LINK
        sync: false
      - key: PAYMENT_LINK
        sync: false
      - key: PAYMENT_AMOUNT
        value: "690"
    healthCheckPath: /health
