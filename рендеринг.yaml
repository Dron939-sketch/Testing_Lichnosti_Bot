# Сервис 1: Telegram Bot
- type: worker  # ← ИЗМЕНИТЬ С web НА worker
  name: variatica-bot
  runtime: python
  buildCommand: |
    pip install --upgrade pip
    pip install -r requirements.txt
  startCommand: python бот_адаптивный.py
  envVars:
    - key: TELEGRAM_BOT_TOKEN
      sync: false
    - key: YOOKASSA_SHOP_ID
      sync: false
    - key: YOOKASSA_SECRET_KEY
      sync: false
    - key: FLASK_API_URL
      value: https://variatica-webhook.onrender.com
    - key: DATABASE_URL
      fromDatabase:
        name: variatica-db
        property: connectionString
  # УДАЛИТЬ healthCheckPath для worker
