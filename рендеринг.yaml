services:
  - type: web  # Оставляем web, т.к. есть Flask
    name: variatica-bot-and-api
    env: python
    region: frankfurt
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: gunicorn simple_server:app
    envVars:
      - key: PORT
        value: "10000"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: BOT_LINK
        sync: false
      - key: GIFT_PDF_LINK
        sync: false
      - key: AUTHOR_LINK
        sync: false
      - key: PAYMENT_LINK
        sync: false
      - key: PAYMENT_AMOUNT
        value: "690"
      - key: WEBHOOK_URL
        value: "https://testing-lichnosti-bot-qyra.onrender.com"
    healthCheckPath: /health
    autoDeploy: true
