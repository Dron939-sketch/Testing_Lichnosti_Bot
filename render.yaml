services:
  # Telegram Bot (Background Worker)
  - type: worker
    name: variatica-telegram-bot
    env: python
    runtime: python-3.11.9
    
    # Автоматическая сборка
    autoDeploy: true
    
    # Health check
    healthCheckPath: /health
    healthCheckTimeout: 10
    
    # Сборка
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      echo "✅ Зависимости установлены"
    
    # Запуск бота
    startCommand: python bot_adaptive.py
    
    # Переменные окружения
    envVars:
      # ОБЯЗАТЕЛЬНЫЕ (заполнить в панели Render)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      
      # Для платежей (если нужны)
      - key: YOOKASSA_SHOP_ID
        sync: false
      - key: YOOKASSA_SECRET_KEY
        sync: false
      - key: WEBHOOK_URL
        value: https://ваш-webhook-сервер.onrender.com
      
      # ОПЦИОНАЛЬНЫЕ
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_ID
        sync: false
      - key: LOG_LEVEL
        value: INFO
      - key: PAYMENT_AMOUNT
        value: "690"
      - key: PAYMENT_CURRENCY
        value: "RUB"
